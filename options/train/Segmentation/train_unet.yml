# general settings
name: unet_segmentation
model_type: UNetModel
num_gpu: 1
scale: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: Drive
    type: PairedImageDataset
    dataroot_gt: ./datasets/Segmentation/DRIVE/train/masks
    dataroot_lq: ./datasets/Segmentation/DRIVE/train/images
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: YourValDataset
    type: PairedImageDataset
    dataroot_gt: ./datasets/Segmentation/DRIVE/test/masks
    dataroot_lq: ./datasets/Segmentation/DRIVE/test/images
    io_backend:
      type: disk

# network structures
network_g:
  type: UNet
  num_in_ch: 3
  num_out_ch: 3 # change this to the number of your classes
  num_feat: 64
  num_block: 2

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000, 50000, 50000, 50000]
    restart_weights: [1, 0.5, 0.5, 0.5]
    eta_min: !!float 1e-7

  total_iter: 100000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: MSELoss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true

  metrics:
    Accuracy: # metric name, can be arbitrary
      type: calculate_niqe
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500