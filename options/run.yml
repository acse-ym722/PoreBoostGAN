name: SR_ESRGAN_carbon2_strategy1
model_type: ESRGANModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 2nd test dataset
    name: test_images
    type: SingleImageDataset
    # dataroot_lq: ./LR/carbon1/low
    # dataroot_lq: ./LR/carbon2/16
    # dataroot_lq: ./results/ESRGAN_Carbon2/visualization/
    # dataroot_lq: ./results/ESRGAN_Carbon1/visualization/
    # dataroot_lq: ./datasets/carbonates2.0/16_down/
    # dataroot_lq: ./datasets/CARBONATES/Low_resolution
    dataroot_lq: ./LR/SR_example/carbon2_low_half
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

path:
  # pretrain_network_g: models/ESRGAN_Carbon1_1M.pth
  pretrain_network_g: models/ESRGAN_carbon2.pth
  strict_load_g: true
  # suffix: ~

val:
  save_img: True
