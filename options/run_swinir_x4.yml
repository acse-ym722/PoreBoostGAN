name: SR_SwinIRGAN_carbon2_strategy1
model_type: SwinIRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 2nd test dataset
    name: test_images
    type: SingleImageDataset
    # dataroot_lq: ./LR/carbon1/low
    # dataroot_lq: ./LR/carbon2/16
    # dataroot_lq: ./results/GAN_SwinIR_Carbonates2/visualization/
    # dataroot_lq: ./results/GAN_SwinIR_Carbonates1/visualization/
    # dataroot_lq: ./datasets/carbonates2.0/16_down/
    dataroot_lq: ./LR/SR_example/carbon2_high
    io_backend:
      type: disk

# network structures
network_g:
  type: SwinIR
  upscale: 4
  in_chans: 3
  img_size: 48
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 96
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 4
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  # pretrain_network_g: models/SwinIR2.pth
  pretrain_network_g: models/GAN_SwinIR2.pth
  strict_load_g: true
  # suffix: ~

val:
  save_img: True
