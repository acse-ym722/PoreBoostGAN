name: ESRGAN_denoise
model_type: ESRGANModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 2nd test dataset
    name: test_images
    type: SingleImageDataset
    dataroot_lq: data/mengyang/CARBONATES/3DSR/stage2/slice_images
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 32
  num_block: 12

path:
  pretrain_network_g: models/denoise.pth
  strict_load_g: true
  # suffix: ~

val:
  save_img: True
