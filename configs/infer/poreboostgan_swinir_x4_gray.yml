name: poreboostgan_swinir_infer_x4_gray
model_type: SwinIRModel
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  test_1:
    name: carbonates_demo
    type: SingleImageDataset
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low/validation
    img_flag: grayscale
    io_backend:
      type: disk

network_g:
  type: SwinIR
  upscale: 4
  in_chans: 1
  img_size: 48
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 96
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 4
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  pretrain_network_g: models/poreboostgan_swinir_x4_gray.pth
  strict_load_g: true

val:
  save_img: true
