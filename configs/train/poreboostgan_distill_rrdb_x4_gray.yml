name: poreboostgan_distill_rrdb_x4_gray
model_type: DistillFeatureSRModel
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: carbonates_train
    type: PairedImageDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/train
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub/train
    meta_info_file: data/mengyang/CARBONATES/3DSR/meta_info/meta_info_high_carbon.txt
    filename_tmpl: '{}'
    img_flag: grayscale
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: carbonates_val
    type: PairedImageDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/validation
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub/validation
    img_flag: grayscale
    io_backend:
      type: disk

network_g:
  type: RRDBNet
  num_in_ch: 1
  num_out_ch: 1
  scale: 4
  num_feat: 16
  num_block: 4
  num_grow_ch: 16

network_teacher:
  type: RRDBNet
  num_in_ch: 1
  num_out_ch: 1
  scale: 4
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

path:
  pretrain_network_teacher: models/poreboostgan_esrgan_teacher_x4_gray.pth
  strict_load_teacher: true
  param_key_teacher: params
  pretrain_network_g: ~
  strict_load_g: false
  pretrain_network_feat_adaptor: ~
  strict_load_feat_adaptor: true
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 25000, 40000, 45000, 300000]
    gamma: 0.5

  total_iter: 400000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      conv5_4: 1
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 1.0
    style_weight: 0
    criterion: l1

  distill_weight_feat: 1.0
  distill_weight_pix: 0.05
  distill_weight_percep: 0.1
  gt_loss_weight: 0.05

val:
  val_freq: !!float 5e3
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
      better: higher
    niqe:
      type: calculate_niqe
      crop_border: 4
      test_y_channel: false
      better: higher

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
