name: poreboostgan_esrgan3d_x4_4090
model_type: ESRGANModel
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: carbonates_train_3d_x4
    type: PairedVolumeDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/train
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub_x4/train
    filename_tmpl: '{}'
    data_format: auto
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: carbonates_val_3d_x4
    type: PairedVolumeDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/validation
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub_x4/validation
    filename_tmpl: '{}'
    data_format: auto
    io_backend:
      type: disk

network_g:
  type: RRDBNet3D
  num_in_ch: 1
  num_out_ch: 1
  scale: 4
  num_feat: 48
  num_block: 12
  num_grow_ch: 24

network_d:
  type: UNetDiscriminatorSN3D
  num_in_ch: 1
  num_feat: 32
  skip_connection: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 25000, 40000, 45000, 300000]
    gamma: 0.5

  total_iter: 1000000
  warmup_iter: -1

  pixel_opt:
    type: MSELoss
    loss_weight: !!float 0.02
    reduction: mean
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 1e-3

  net_d_iters: 1
  net_d_init_iters: 0

val:
  val_freq: !!float 2e3
  save_img: true
  metrics:
    psnr_3d:
      type: calculate_psnr_3d
      crop_border: 4
      input_order: DHWC
      data_range: 1.0
      better: higher

logger:
  print_freq: 20
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
