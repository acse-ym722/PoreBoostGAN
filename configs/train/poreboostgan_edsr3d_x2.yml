name: poreboostgan_edsr3d_x2
model_type: SRModel
scale: 2
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: carbonates_train_3d_x2
    type: PairedVolumeDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/train
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub/train
    filename_tmpl: '{}'
    data_format: auto
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: carbonates_val_3d_x2
    type: PairedVolumeDataset
    dataroot_gt: data/mengyang/CARBONATES/3DSR/High_sub/validation
    dataroot_lq: data/mengyang/CARBONATES/3DSR/Low_sub/validation
    filename_tmpl: '{}'
    data_format: auto
    io_backend:
      type: disk

network_g:
  type: EDSR3D
  num_in_ch: 1
  num_out_ch: 1
  num_feat: 48
  num_block: 8
  upscale: 2
  res_scale: 0.1

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 50000, 100000]
    gamma: 0.5

  total_iter: 200000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 2e3
  save_img: false
  metrics:
    psnr_3d:
      type: calculate_psnr_3d
      crop_border: 2
      input_order: DHWC
      data_range: 1.0
      better: higher

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
